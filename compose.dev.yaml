services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chayxana
      POSTGRES_PASSWORD: chayxana
      POSTGRES_DB: chayxana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chayxana -d chayxana"]
      interval: 5s
      timeout: 3s
      retries: 20

  master-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      bash -lc "pnpm install --frozen-lockfile
      && pnpm --filter @chayxana/master exec prisma generate
      && pnpm --filter @chayxana/master exec prisma migrate deploy
      && pnpm --filter @chayxana/master exec tsx scripts/serve-headless.ts"
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:/app/apps/master/prisma/dev.db
      - ELECTRON_OVERRIDE_DIST_PATH=/opt/electron-not-installed
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - master_modules:/app/apps/master/node_modules
      - order_modules:/app/apps/order/node_modules
      - mobile_modules:/app/apps/mobile/node_modules
volumes:
  pgdata:
  node_modules:
  master_modules:
  order_modules:
  mobile_modules:
