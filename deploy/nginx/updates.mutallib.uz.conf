# updates.mutallib.uz — the Chayxana Master update feed.
#
# NOT APPLIED. This is the repo's copy of record. The server's copy lives on
# avtobron at /root/click_avto/deploy/nginx/updates.conf and is installed by
# hand — see docs/UPDATE_FEED_RUNBOOK.md §2. Keep the two in sync: if you edit
# one, edit the other in the same change.
#
# Static files only. Nothing here proxies to an application, nothing here
# accepts a write. Publishing happens over ssh/rsync into the directory this
# server reads, never over HTTP.
#
# It lives inside the click-avto nginx (`click-avto-nginx-1`) because that
# container already owns :80 and :443 on the box and already mounts the certbot
# volumes. That container also fronts carmap.uz — a different client's
# production site — so once the two bind mounts exist, every change to this
# file is `cat >` plus `nginx -s reload`, and never a container recreate.
#
# Two host bind mounts are required, both added to the nginx service in
# /root/click_avto/deploy/docker-compose.yml:
#   ./nginx/updates.conf:/etc/nginx/conf.d/updates.conf:ro
#   /srv/updates:/usr/share/nginx/updates:ro
#
# Note: no `map` block here. epa.conf already defines the $connection_upgrade
# map at http level and a second definition is a duplicate-directive error.

# ---- HTTP :80 — ACME challenge, everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name updates.mutallib.uz;

    # Renewals. The first issuance does not need this block: carmap.conf is
    # loaded as default.conf, so its :80 server is nginx's implicit default for
    # port 80 and already serves this path for any Host. That is what lets the
    # certificate be issued before this file exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — the feed ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name updates.mutallib.uz;

    ssl_certificate     /etc/letsencrypt/live/updates.mutallib.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.mutallib.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/updates;

    # The feed is not a file browser. A listing would advertise every version
    # ever shipped and every variant directory that exists.
    autoindex off;

    # No gzip. These are a YAML manifest of a few hundred bytes and a 150 MB
    # compressed installer; gzip buys nothing and rewriting the body breaks the
    # byte-range requests a resumed or differential download depends on.
    gzip off;

    # latest.yml is the trigger: electron-updater reads it first and compares
    # its `version` against the running build. A cached copy means a till keeps
    # seeing the old version after a publish — or, worse, keeps seeing the bad
    # one after a rollback.
    location = /chayxana/master/production/latest.yml {
        default_type text/yaml;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Installers and blockmaps are immutable: the version is in the filename and
    # a published file is never rewritten. Rolling back republishes latest.yml,
    # not the binary.
    #
    # The path is pinned to the production directory on purpose. It is the third
    # independent guard against a `next` build ever reaching this feed (the
    # others are `publish: null` in electron-builder.next.js and
    # `updateFeedUrl: null` in app-identity.ts): an installer dropped into the
    # wrong directory here is served as 404, not as an update.
    location ~ ^/chayxana/master/production/[A-Za-z0-9._-]+\.(exe|blockmap)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else, including the per-version latest-<version>.yml rollback
    # copies kept on disk beside the live manifest.
    location / {
        return 404;
    }
}
